<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103c34"><title>Holiday Finance Quest</title><style>
:root{--pine:#103c34;--pine2:#194d42;--cream:#fff9eb;--gold:#edc879;--mint:#afd0b8;--red:#d88778;--line:#ffffff25;--dim:#c4d5c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#36735d 0%,var(--pine) 55%);color:var(--cream);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.wrap{width:min(100%,700px);margin:auto;padding:0 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.brand{font-size:13px;letter-spacing:1.6px;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--mint);font-weight:600}.top-stat{font-size:12px;color:var(--dim);text-align:right}.hero{padding:25px 2px 15px}.season{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:750}.hero h1{font:500 clamp(32px,8vw,44px)/1.05 Georgia,serif;margin:8px 0 10px}.hero p{margin:0;color:var(--dim);font-size:15px}.snowline{color:#f0d796;letter-spacing:9px;font-size:16px;margin-top:14px}.card{background:#ffffff0b;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 28px #071f1c22}.progress-row{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px}.bar{height:7px;background:#ffffff20;border-radius:20px;margin:11px 0 16px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:20px;transition:width .2s}.topic{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);font-weight:800}.qtitle{font:500 23px/1.22 Georgia,serif;margin:9px 0}.question{font-size:18px;line-height:1.45;margin:0 0 17px}.choices{display:grid;gap:10px}.choice{min-height:55px;text-align:left;background:#ffffff09;border:1px solid #ffffff30;border-radius:14px;padding:12px 15px;font-size:17px;font-weight:650}.choice:active{transform:scale(.99)}.choice.correct{border-color:var(--mint);background:#afd0b822}.choice.wrong{border-color:var(--red);background:#d8877822}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:14px;border-left:3px solid var(--gold);background:#0a3029;border-radius:4px 13px 13px 4px}.feedback.show{display:block}.feedback strong{color:var(--gold)}.feedback p{margin:5px 0;color:var(--dim);font-size:14px}.actions{display:flex;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);border-radius:14px;min-height:52px;padding:12px 16px;background:#ffffff10;font-weight:750;flex:1}.btn.primary{background:var(--gold);color:#193b30;border-color:var(--gold)}.btn:disabled{opacity:.45}.small-actions{display:flex;justify-content:space-between;margin-top:10px}.text-btn{border:0;background:none;padding:10px 4px;color:var(--mint);font-size:13px;text-decoration:underline;text-underline-offset:3px}.panel-title{font:500 21px Georgia,serif;margin:0 0 10px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{background:#ffffff0b;border-radius:14px;padding:12px;text-align:center}.mini b{display:block;font-size:21px;color:var(--gold)}.mini span{font-size:11px;color:var(--dim)}.how{font-size:13px;color:var(--dim);margin:10px 0 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);border-radius:30px;background:#ffffff08;padding:7px 10px;font-size:11px;color:var(--dim)}.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:#0b302bf2;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;z-index:2}.bottom button{border:0;background:transparent;color:var(--dim);padding:7px 15px;font-size:12px}.bottom button.active{color:var(--gold)}.hide{display:none!important}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#153d34;border-radius:12px;padding:10px 16px;font-weight:700;z-index:9;box-shadow:0 4px 18px #0004}.reviewitem{padding:12px 0;border-top:1px solid var(--line)}.reviewitem b{color:var(--gold)}.empty{text-align:center;padding:30px 10px;color:var(--dim)}@media(min-width:600px){.wrap{padding-left:24px;padding-right:24px}.hero{padding-top:34px}.question{font-size:20px}.card{padding:23px}}

.wrap{position:relative;z-index:1}.brand{border-left:4px solid transparent;border-image:repeating-linear-gradient(135deg,#fff 0 5px,#df7068 5px 10px) 1;padding-left:10px}.top{border-bottom:1px solid #fff4}.card{overflow:hidden}.card:before{content:"✧  ❄  ✧";position:absolute;right:15px;top:7px;color:#f4d99e;opacity:.52;font-size:12px;letter-spacing:4px;pointer-events:none}.hero{position:relative}.season{color:#f4d58f}.snowline{display:flex;align-items:center;gap:9px}.snow-scene{display:flex;align-items:center;gap:10px;margin:18px 0 8px;color:#ffe2aa}.snowman{font-size:51px;line-height:1;filter:drop-shadow(0 5px 8px #061d1c77);animation:bob 4s ease-in-out infinite}.tree{font-size:30px;line-height:1}.scene-copy{font-size:12px;letter-spacing:1px;color:var(--mint);text-transform:uppercase}.candy-rule{height:7px;border-radius:9px;margin:13px 0;background:repeating-linear-gradient(135deg,#fff 0 7px,#d97169 7px 14px);opacity:.9}.game-grid{display:grid;gap:12px}.game-card{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:16px;border:1px solid var(--line);border-radius:16px;background:#ffffff08}.game-icon{font-size:34px;text-align:center;line-height:1.2}.game-card h3{font:600 17px system-ui;margin:0 0 4px;color:var(--cream)}.game-card p{font-size:13px;color:var(--dim);margin:0 0 10px}.game-card .btn{min-height:46px;padding:9px 12px}.mini-tag{display:inline-block;color:#f1d28d;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}.bottom{z-index:5}.bottom button{font-weight:700}.bottom button.active{color:#f3d18a;text-shadow:0 0 12px #f3d18a55}.btn.primary{background:linear-gradient(135deg,#f7dfa4,#edc879);box-shadow:0 5px 16px #050f0d33}.game-banner{border:1px solid #edc87955;background:linear-gradient(135deg,#f2d39114,#fff8eb08);border-radius:14px;padding:11px 13px;margin:0 0 13px;color:#f4d58f;font-size:12px;font-weight:750;letter-spacing:.8px}.snow-tag{color:#f4d58f}
@keyframes bob{50%{transform:translateY(-5px)}}

.case-list{display:grid;gap:11px}.case-tile{border:1px solid #ffffff28;border-radius:16px;padding:15px;background:linear-gradient(140deg,#ffffff0b,#ffffff05)}.case-tile-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.case-tile h3{font:600 17px system-ui;margin:3px 0 6px}.case-tile p{font-size:13px;color:var(--dim);margin:0 0 10px}.case-facts{display:grid;gap:7px;margin:10px 0 15px;padding:0;list-style:none}.case-facts li{border-left:2px solid var(--gold);padding:6px 10px;background:#ffffff08;border-radius:0 8px 8px 0;color:var(--dim);font-size:14px}.case-step{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}.case-story{padding:14px;background:#ffffff09;border:1px solid #ffffff20;border-radius:14px;margin:13px 0}.case-story p{margin:0 0 9px;color:var(--dim)}.case-choice{min-height:60px}.case-score{font-size:12px;color:var(--dim)}.case-tile .btn{min-height:46px}
.bottom{gap:2px;padding-left:4px;padding-right:4px}.bottom button{flex:1;min-width:0;padding:7px 4px;font-size:10px;white-space:nowrap}

</style></head><body><div class="wrap"><header class="top"><div class="brand">🎄 HOLIDAY FINANCE QUEST<small>STRATEGY · PRICING · ECONOMICS</small></div><div class="top-stat" id="headerStat">0 answered<br>0 correct</div></header><main id="screen"></main></div><nav class="bottom"><button class="active" data-tab="play">🎁 Play</button><button data-tab="games">🕹 Games</button><button data-tab="cases">🏠 Cases</button><button data-tab="progress">✦ Progress</button><button data-tab="review">↺ Review</button></nav><div id="toast" class="toast hide"></div><script>
(()=>{const $=s=>document.querySelector(s),screen=$('#screen');const topics=['API revenue & margin','Pricing & packaging','Commitments & discounts','Forecasting & scenarios','Customer economics','Capacity & investment','Sales efficiency','Product finance'];const names=['the API sleigh','the model workshop','the enterprise lodge','the winter launch','the pricing chalet','the snowday forecast','the capacity cabin','the new product village','the December deal desk','the evergreen portfolio'];const money=n=>'$'+Number(n).toLocaleString('en-US');const rows=[];let counter=0;
function add(topic,title,q,answer,explain,takeaway,unit=''){const id='q'+counter++,correct=Number(answer),step=Math.abs(correct)<20?2:Math.abs(correct)<100?10:100;let opts=[correct,correct-step*2,correct-step,correct+step];const seed=counter*37;opts.sort((a,b)=>((a*seed)%997)-((b*seed)%997));rows.push({id,topic,title,q,answer:correct,unit,choices:opts,explain,takeaway})}
const CASES=[
{id:'commitment',icon:'🎁',title:'The Commitment Snowglobe',tag:'API pricing · commitments',setup:'A growing API customer wants a larger discount in exchange for a monthly usage commitment. You need to protect contribution while giving the customer a reason to consolidate spend.',facts:['Current monthly revenue: $100k','Monthly direct serving cost: $40k','Requested deal: 20% off $125k of list-value usage'],decisionQ:'What would you recommend to the deal team?',choices:['Approve 20% off all usage right away.','Tie the discount to a verified commitment threshold; model incremental usage, cannibalization, and serving cost.','Decline every discount so list price stays intact.'],best:1,decisionWhy:'A commitment can improve predictability, but the discount only creates value if it secures incremental or retained spend without giving away margin on usage that would have happened anyway.',mathQ:'At 20% off $125k of list-value usage, what is the customer’s net monthly bill?',mathChoices:['$80k','$100k','$125k'],mathBest:1,mathWhy:'They pay 80% of list: $125k × 0.8 = $100k. That matches today’s $100k revenue, so the commitment alone does not prove incremental uplift.'},
{id:'capacity',icon:'🛷',title:'The GPU Gift Shop',tag:'Capacity · contribution',setup:'Two workloads want the same scarce compute capacity. You have room to prioritize one this month, and both have strategic customers behind them.',facts:['Workload A: $40k contribution using 4 capacity blocks','Workload B: $30k contribution using 2 capacity blocks','Capacity is the binding constraint this month'],decisionQ:'How should you prioritize the constrained capacity?',choices:['A, because it creates the most total contribution.','B, because it creates more contribution per scarce block; then check strategic commitments.','Split capacity evenly to avoid making a trade-off.'],best:1,decisionWhy:'When capacity is constrained, compare incremental contribution per block, then account for contractual obligations and strategic option value.',mathQ:'How much contribution does Workload B earn per capacity block?',mathChoices:['$7.5k','$15k','$30k'],mathBest:1,mathWhy:'$30k ÷ 2 blocks = $15k contribution per block. Workload A earns $10k per block.'},
{id:'bundle',icon:'🍬',title:'The Candy Cane Bundle',tag:'Pricing · packaging',setup:'Product wants to bundle two services to simplify buying. The sales team likes the simpler offer, but Finance wants to know what adoption increase would offset the lower price.',facts:['Combined standalone price: $120k','Proposed bundle price: $100k','Assume serving cost per customer stays the same'],decisionQ:'What is the right way to evaluate the bundle?',choices:['Launch broadly because a simpler offer always improves conversion.','Pilot by segment and track adoption, realized price, usage, and margin against a standalone control.','Reject the bundle because any price reduction lowers revenue.'],best:1,decisionWhy:'A bundle can unlock adoption, but you need to measure whether incremental customers and usage offset lower realized price and any cost-to-serve change.',mathQ:'How much more volume is needed at $100k to match the revenue from one $120k sale?',mathChoices:['10% more','20% more','30% more'],mathBest:1,mathWhy:'$120k ÷ $100k = 1.2. You need 20% more volume to reach the same revenue.'},
{id:'retention',icon:'🎄',title:'The Retention Wreath',tag:'Retention · deal economics',setup:'A sales lead asks for a broad renewal discount. The account team has identified a smaller group of customers with credible churn risk.',facts:['4 customers are at real risk of leaving','Each at-risk customer has $50k ARR','A targeted save offer would cost $5k per customer'],decisionQ:'What should Finance recommend?',choices:['Give every customer the discount to keep the process simple.','Target the offer to credible at-risk accounts and compare retained contribution with the concession.','Avoid all incentives, even where churn is likely.'],best:1,decisionWhy:'A targeted offer limits discount leakage. Confirm the churn signal, renewal likelihood, and contribution retained before scaling the offer.',mathQ:'If the offer saves all 4 customers, how much ARR is retained?',mathChoices:['$100k','$200k','$250k'],mathBest:1,mathWhy:'4 customers × $50k ARR each = $200k ARR retained. Compare contribution, not just ARR, with the $20k total offer cost.'},
{id:'forecast',icon:'❄️',title:'The Forecast Flurry',tag:'Strategic finance · scenarios',setup:'A monthly revenue forecast is under pressure after a strong usage spike. Leadership wants a decision-ready view before committing extra capacity.',facts:['Downside case: $80m','Base case: $100m','Upside case: $120m; treat all three cases as equally likely'],decisionQ:'What forecast approach is most useful?',choices:['Annualize the latest high-usage week.','Use a driver-based range, probability-weight the scenarios, and show which assumptions change the decision.','Use only the downside case so the forecast is conservative.'],best:1,decisionWhy:'A range plus explicit drivers shows what could happen and what actions matter. A single extrapolation can mistake timing or mix for durable growth.',mathQ:'With equal probabilities, what is expected revenue across the three cases?',mathChoices:['$90m','$100m','$110m'],mathBest:1,mathWhy:'($80m + $100m + $120m) ÷ 3 = $100m expected revenue.'},
{id:'vertical',icon:'🏘️',title:'The New Vertical Village',tag:'Market sizing · investment',setup:'The team sees an opportunity to enter a new regulated vertical, but engineering capacity is limited and customer evidence is still early.',facts:['100 reachable target accounts','20% are likely to engage in the first year','25% of engaged accounts may convert at $200k ARR each'],decisionQ:'What is the best next move?',choices:['Fund a full product build from the top-down market estimate.','Run a focused pilot, validate willingness to pay and sales cycle, then stage engineering investment.','Wait until every uncertainty is resolved before talking to customers.'],best:1,decisionWhy:'A pilot tests demand, implementation cost, and sales friction before a large commitment. Stage investment against evidence and clear go/no-go milestones.',mathQ:'What ARR does the first-year funnel imply if the assumptions hold?',mathChoices:['$500k','$1m','$2m'],mathBest:1,mathWhy:'100 × 20% = 20 engaged accounts; 20 × 25% = 5 wins; 5 × $200k = $1m ARR.'},
{id:'price-test',icon:'🕯️',title:'The Price Increase Trial',tag:'Pricing · elasticity',setup:'A product lead wants a 10% price increase. You expect usage or customer count to fall by about 5%, but the estimate is uncertain.',facts:['Current monthly revenue: $100k','Proposed price increase: 10%','Expected volume response: 5% decline'],decisionQ:'How should you proceed?',choices:['Roll the increase out to every customer immediately.','Test by segment, measure realized price and volume response, and monitor retention and contribution.','Reject the increase because volume may decline.'],best:1,decisionWhy:'A controlled test reveals elasticity by segment and gives room to adjust packaging or discounts. Evaluate contribution and retention, not revenue alone.',mathQ:'Using those assumptions, what is approximate new monthly revenue?',mathChoices:['$95k','$100k','$105k'],mathBest:2,mathWhy:'$100k × 1.10 × 0.95 = $104.5k, or about $105k. Contribution could move differently if usage costs change.'},
{id:'latency',icon:'⏱️',title:'The Latency Lantern',tag:'Product investment · payback',setup:'An engineering proposal would improve response latency for business customers. Finance needs to connect the benefit to customer outcomes and a measured investment case.',facts:['Incremental monthly investment: $20k','Forecast incremental monthly gross profit: $10k','Benefits depend on faster response being a real buying or retention factor'],decisionQ:'What is the strongest recommendation?',choices:['Fund the full rollout because faster is always better.','Pilot with customers who cite latency as a blocker; track adoption, retention, and gross-profit lift before scaling.','Reject the work because it does not lower unit costs.'],best:1,decisionWhy:'Connect product performance to willingness to pay, conversion, retention, and serving cost. A targeted pilot tests whether the value is real before scaling spend.',mathQ:'At $10k of added monthly gross profit, how long is simple payback on $20k of investment?',mathChoices:['1 month','2 months','4 months'],mathBest:1,mathWhy:'$20k ÷ $10k per month = 2 months. This simple payback excludes ramp, risk, and benefits after the payback date.'}
];
const vals=(a,d)=>Array.from({length:250},(_,i)=>a+i*d);const revs=vals(20,10),costs=vals(10,5),counts=vals(10,5),prices=vals(8,2),spends=vals(100,50);
for(let i=0;i<120;i++){const r=revs[i],n=counts[i],p=prices[i],s=spends[i],nm=names[i%names.length],discount=[10,20,25,30,40][i%5],growth=[10,20,25,50][i%4];
add(0,`Margin check at ${nm}`,`The product earns ${money(r)}k revenue and costs ${money(r/2)}k to serve. What is gross margin?`,50,`Revenue less serving cost is ${r/2}k; half of revenue is 50%.`,`Keep the margin definition consistent when comparing products.`,'%');
add(0,`Serving cost at ${nm}`,`Revenue is ${money(r)}k and gross margin is 75%. What are serving costs?`,r/4,`At 75% margin, costs are the remaining 25%. One quarter of ${r} is ${r/4}k.`,`A growing product can still have weak contribution if unit costs rise.`,'$k');
add(1,`Discount on the gift bundle`,`List price is ${money(p*10)} per month. The offer gives ${discount}% off. How many dollars does the customer save each month?`,p*10*discount/100,`${discount}% of ${p*10} is ${p*10*discount/100}.`,`Tie discounts to a clear customer behavior or commitment.`,'$');
add(1,`Net price after the holiday offer`,`A plan lists at ${money(p*20)} per month and gets a 25% discount. What is the net monthly price?`,p*15,`A 25% discount means paying three quarters: ${p*20} × 0.75 = ${p*15}.`,`Track realized price after discounts, credits, and mix.`,'$');
add(2,`Commitment growth hurdle`,`A customer commits ${money(s)}k at a 20% discount. How much total usage value must they consume to equal the commitment's list value?`,s*1.25,`A 20% discount means paying 80 cents per dollar: ${s} ÷ 0.8 = ${s*1.25}k.`,`Check utilization and overage behavior before offering a bigger discount.`,'$k');
add(2,`Break-even volume after a price cut`,`Price falls from $${p*2} to $${p}. What volume increase preserves revenue?`,100,`The price is cut in half, so volume must double: 100% more.`,`Revenue break-even does not preserve margin when unit costs stay the same.`,'%');
add(3,`Expected winter forecast`,`Downside is ${money(r)}m, base is ${money(r*2)}m, upside is ${money(r*3)}m. Each case is equally likely. What is expected revenue?`,r*2,`Average the three cases: (${r} + ${r*2} + ${r*3}) ÷ 3 = ${r*2}m.`,`Show the range and the assumptions that move the outcome.`,'$m');
add(3,`Forecast variance at ${nm}`,`Plan is ${money(r)}m and actual is ${money(r+10)}m. How many dollars above plan is actual?`,10,`Actual minus plan: ${r+10} − ${r} = $10m.`,`Explain the driver of the variance, not only its size.`,'$m');
add(4,`Expansion wreath`,`A customer starts at ${money(r)}k ARR, adds ${money(r/2)}k expansion, and loses ${money(r/4)}k to contraction. What is ending ARR?`,r*1.25,`${r} + ${r/2} − ${r/4} = ${r*1.25}k.`,`Separate expansion, contraction, and churn to see retention quality.`,'$k');
add(4,`Usage mix shift`,`A customer spends ${money(r)}k on input and ${money(r)}k on output. Output pricing is 3× input pricing. How much of the bill comes from output?`,75,`Three parts of the bill are output and one part is input. Output is 3/4, or 75%.`,`Usage mix can move revenue and serving costs even when total tokens are flat.`,'%');
add(5,`Capacity cabin contribution`,`A workload brings ${money(r*3)}k revenue and costs ${money(r)}k to serve. It uses ${n*2} capacity blocks. What contribution does each block earn?`,1000,`Contribution is ${r*2}k. Divide by ${n*2} blocks: $1,000 per block.`,`Rank scarce capacity by incremental contribution, then include strategic constraints.`,'$/block');
add(5,`Simple payback at ${nm}`,`A launch costs ${money(s)}k and adds ${money(s/4)}k monthly gross profit. What is simple payback?`,4,`${s} ÷ ${s/4} = 4 months.`,`Payback is a quick screen; it leaves out ramp, risk, and later cash flows.`,'months');
add(6,`CAC payback at the lodge`,`Sales and marketing cost ${money(s)} per account. Monthly gross profit is ${money(s/10)} per account. How many months to pay back CAC?`,10,`${s} ÷ ${s/10} = 10 months.`,`Use matched cohorts and gross profit, rather than revenue, for payback.`,'months');
add(6,`Pipeline conversion`,`The team has ${n*10} qualified opportunities and wins ${n*2}. What is its win rate?`,20,`${n*2} is one fifth of ${n*10}: 20%.`,`Look at conversion and deal size together to understand pipeline quality.`,'%');
add(7,`Product launch margin`,`The new feature earns ${money(r)}k. Hosting costs are ${money(r/4)}k and support costs are ${money(r/4)}k. What is gross profit?`,r/2,`Subtract both costs: ${r} − ${r/4} − ${r/4} = ${r/2}k.`,`Include costs that scale with usage and customer support.`,'$k');
add(7,`New vertical village`,`There are ${n*100} eligible firms. 10% adopt, at ${money(prices[i]*100)} annual revenue each. What is annual revenue?`,n*p,`10% of ${n*100} is ${n*10} firms. Multiply by ${p*100}: $${n*p}k.`,`Size a market as a funnel: reachable, converted, retained, monetized.`,'$k');
add(0,`Model cost per success`,`Each attempt costs $${p} and succeeds 50% of the time. If attempts are independent, what is expected cost per successful task?`,p*2,`At a 50% success rate, expect two attempts: 2 × $${p} = $${p*2}.`,`Reliability changes both customer value and serving cost.`,'$');
add(1,`Bundle value at ${nm}`,`A bundle contains services priced at $${p*10} and $${p*5}. The bundle is 20% below the combined price. What is the bundle price?`,p*12,`Combined list is ${p*15}; pay 80%: ${p*15} × 0.8 = $${p*12}.`,`A bundle should improve adoption or retention enough to offset lower realized price.`,'$');
add(2,`Commitment utilization`,`A customer commits ${money(s)}k and uses ${money(s*3/4)}k at list value. What share of commitment value did they use?`,75,`${s*3/4} is three quarters of ${s}: 75%.`,`Low utilization can point to over-selling, weak onboarding, or a commitment sized too high.`,'%');
add(3,`Growth and price bridge`,`Usage grows ${growth}% while realized price stays flat. Starting revenue is ${money(r)}m. What is ending revenue?`,r*(1+growth/100),`${r} × (1 + ${growth}%) = ${r*(1+growth/100)}m.`,`Separate usage, price, mix, and customer count in the revenue bridge.`,'$m');
}
const KEY='holidayFinanceQuest.v1';function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state)state={queue:shuffle(rows.map(x=>x.id)),seen:[],correct:0,answered:0,missed:[],daily:{},streak:0,lastDay:'',mode:'home',game:'mix',session:5,sessionDone:0,current:null,selected:null};const alreadyQueued=new Set([...state.queue,...state.seen,...(state.current?[state.current]:[])]);for(const q of rows)if(!alreadyQueued.has(q.id))state.queue.push(q.id);if(!state.game)state.game='mix';if(!Array.isArray(state.caseSeen))state.caseSeen=[];if(typeof state.caseScore!=='number')state.caseScore=0;if(!('caseId'in state))state.caseId=null;if(!('casePhase'in state))state.casePhase='decision';if(!('caseDecision'in state))state.caseDecision=null;if(!('caseMathChoice'in state))state.caseMathChoice=null;const byId=new Map(rows.map(x=>[x.id,x]));function save(){localStorage.setItem(KEY,JSON.stringify(state));header()}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function header(){$('#headerStat').innerHTML=`${state.answered} answered<br>${state.correct} correct`}
const gameTitles={mix:'Cozy Mix',sprint:'Snowball Sprint',pricing:'Candy Cane Pricing',stress:"Santa's Stress Test"};function drawNext(){const matches=id=>{const q=byId.get(id);if(!q)return false;if(state.game==='pricing')return q.topic===1||q.topic===2;if(state.game==='stress')return q.topic===3||q.topic===5||q.topic===7;return true};const i=state.queue.findIndex(matches);return i<0?state.queue.shift():state.queue.splice(i,1)[0]}function start(game='mix'){if(typeof game!=='string')game='mix';state.game=game;state.session=game==='sprint'?10:5;if(!state.queue.length){state.mode='done';render();return}state.mode='play';state.current=drawNext();state.selected=null;state.sessionDone=0;save();render()}function display(v,q){if(q.unit==='%')return `${v}%`;if(q.unit==='$')return money(v);if(q.unit==='$k')return money(v)+'k';if(q.unit==='$m')return money(v)+'m';if(q.unit==='$/block')return money(v)+'/block';return `${Number(v).toLocaleString('en-US')}${q.unit?' '+q.unit:''}`}
function answer(v){if(state.selected!==null)return;state.selected=v;const q=byId.get(state.current),ok=v===q.answer;state.answered++;state.sessionDone++;if(ok)state.correct++;else if(!state.missed.includes(q.id))state.missed.unshift(q.id);state.seen.push(q.id);const d=today();state.daily[d]=(state.daily[d]||0)+1;if(state.lastDay!==d){const p=new Date();p.setDate(p.getDate()-1);const prev=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-${String(p.getDate()).padStart(2,'0')}`;state.streak=state.lastDay===prev?state.streak+1:1;state.lastDay=d}save();render()}
function next(){if(state.sessionDone>=state.session){state.mode='setdone';render();return}state.mode='play';state.current=drawNext();state.selected=null;if(!state.current)state.mode='done';save();render()}function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),1600)}
function play(){const q=byId.get(state.current),answered=state.selected!==null,ok=answered&&state.selected===q.answer;screen.innerHTML=`<section class="hero"><div class="season">🎄 A quick round for the road</div><h1>One question.<br>One clear decision.</h1><p>Work it out in your head, tap once, and get the quick math.</p><div class="snow-scene"><span class="snowman">⛄</span><span class="tree">🎄</span><span class="scene-copy">Warm up your winter instincts</span></div></section><article class="card"><div class="game-banner">${gameTitles[state.game]||gameTitles.mix} · 🎄 ${state.session}-question round</div><div class="progress-row"><span>Round ${Math.min(state.sessionDone+1,state.session)} of ${state.session}</span><span>${rows.length-state.seen.length} fresh questions left</span></div><div class="bar"><i style="width:${Math.min(100,(state.sessionDone+(answered?1:0))/state.session*100)}%"></i></div><div class="topic">${topics[q.topic]}</div><h2 class="qtitle">${q.title}</h2><p class="question">${q.q}</p><div class="choices">${q.choices.map(v=>`<button class="choice ${answered?(v===q.answer?'correct':v===state.selected?'wrong':''):''}" data-answer="${v}" ${answered?'disabled':''}>${display(v,q)}</button>`).join('')}</div><div class="feedback ${answered?'show':''}"><strong>${ok?'That’s right.':'Here’s the quick math.'}</strong><p>${q.explain}</p><p><b>Decision lens:</b> ${q.takeaway}</p></div><div class="actions"><button class="btn" id="exit">Pause</button><button class="btn primary" id="next" ${answered?'':'disabled'}>${answered?'Next question →':'Choose an answer'}</button></div><div class="small-actions"><button class="text-btn" id="skip">Skip this one</button><button class="text-btn" id="bookmark">☆ Save for review</button></div></article>`;$('.choices').onclick=e=>{const b=e.target.closest('[data-answer]');if(b)answer(Number(b.dataset.answer))};$('#next').onclick=next;$('#exit').onclick=()=>{state.mode='home';render()};$('#skip').onclick=()=>{if(!state.seen.includes(state.current))state.seen.push(state.current);state.sessionDone++;if(state.sessionDone>=state.session)state.mode='setdone';else{state.current=state.queue.shift();state.selected=null;state.mode='play'}save();render()};$('#bookmark').onclick=()=>{if(!state.missed.includes(q.id))state.missed.unshift(q.id);toast('Saved to review');save()}}
function home(){window.tab='play';screen.innerHTML=`<section class="hero"><div class="season">✧ A little holiday practice ✧</div><h1>Think clearly.<br>Price wisely.</h1><p>Short strategic finance and pricing questions about B2B product economics, enterprise deals, and a fast-moving API business.</p><div class="snow-scene"><span class="snowman">⛄</span><span class="tree">🎄</span><span class="scene-copy">Snow much strategy to unwrap</span></div><div class="candy-rule"></div></section><section class="card"><div class="topic">A two-week practice bank</div><h2 class="panel-title">5,000 unique questions</h2><p class="how">Questions stay fresh until the full bank is complete. Round numbers, mental math, 5-question rounds. Pause anytime and resume on this phone.</p><div class="chips">${topics.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="actions"><button class="btn primary" id="play">Start a 5-question round →</button></div></section><section class="card"><div class="statgrid"><div class="mini"><b>${state.answered}</b><span>answered</span></div><div class="mini"><b>${state.correct}</b><span>correct</span></div><div class="mini"><b>${state.streak}</b><span>day streak</span></div></div><p class="how">${state.seen.length} of ${rows.length} used · ${rows.length-state.seen.length} still new</p></section>`;$('#play').onclick=start}
function games(){screen.innerHTML=`<section class="hero"><div class="season">🕹 Holiday game room</div><h1>Pick your<br>winter challenge.</h1><p>Each game is a short, no-paper round. Solve the numbers in your head, then tap your answer.</p><div class="snow-scene"><span class="snowman">⛄</span><span class="tree">🎄</span><span class="scene-copy">Choose a game & sleigh it</span></div><div class="candy-rule"></div></section><section class="card"><div class="topic">Choose your game</div><div class="game-grid"><article class="game-card"><div class="game-icon">❄️</div><div><span class="mini-tag">10 questions · mixed topics</span><h3>Snowball Sprint</h3><p>A longer mixed round to warm up your finance reflexes. No timer; play at your own pace.</p><button class="btn primary" data-game="sprint">Start the sprint →</button></div></article><article class="game-card"><div class="game-icon">🍬</div><div><span class="mini-tag">5 questions · pricing focus</span><h3>Candy Cane Pricing</h3><p>Practice discounts, net price, commitments, and break-even volume.</p><button class="btn primary" data-game="pricing">Price it →</button></div></article><article class="game-card"><div class="game-icon">🎅</div><div><span class="mini-tag">5 questions · strategy focus</span><h3>Santa’s Stress Test</h3><p>Work through forecasts, capacity choices, and product investment trade-offs.</p><button class="btn primary" data-game="stress">Take the challenge →</button></div></article><article class="game-card"><div class="game-icon">🎁</div><div><span class="mini-tag">5 questions · all topics</span><h3>Cozy Mix</h3><p>A fresh mix across B2B finance, API economics, and pricing.</p><button class="btn primary" data-game="mix">Play a mixed round →</button></div></article></div></section>`;document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game))}
function startCase(id){const c=CASES.find(x=>x.id===id);if(!c)return;state.caseId=id;state.casePhase='decision';state.caseDecision=null;state.caseMathChoice=null;state.mode='case';save();render()}
function answerCaseDecision(i){state.caseDecision=Number(i);if(state.caseDecision===CASES.find(x=>x.id===state.caseId).best)state.caseScore++;save();render()}
function answerCaseMath(i){state.caseMathChoice=Number(i);if(state.caseMathChoice===CASES.find(x=>x.id===state.caseId).mathBest)state.caseScore++;state.casePhase='math-result';save();render()}
function finishCase(){if(state.caseId&&!state.caseSeen.includes(state.caseId))state.caseSeen.push(state.caseId);state.caseId=null;state.casePhase='decision';state.caseDecision=null;state.caseMathChoice=null;state.mode='home';window.tab='cases';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='cases'));save();render()}
function caseHome(){const next=CASES.find(c=>!state.caseSeen.includes(c.id));const active=CASES.find(c=>c.id===state.caseId);screen.innerHTML=`<section class="hero"><div class="season">🎭 Case Cabin · holiday strategy games</div><h1>Make the call.<br>Show your math.</h1><p>Short B2B mini-cases with two steps: choose a recommendation, then solve a round-number checkpoint in your head.</p><div class="snow-scene"><span class="snowman">⛄</span><span class="tree">🎄</span><span class="scene-copy">Your winter casebook awaits</span></div><div class="candy-rule"></div></section><section class="card"><div class="statgrid"><div class="mini"><b>${state.caseSeen.length}/${CASES.length}</b><span>cases cleared</span></div><div class="mini"><b>${state.caseScore}</b><span>strong calls</span></div><div class="mini"><b>2</b><span>steps per case</span></div></div><p class="case-score">Each case takes about 3–5 minutes. Think out loud before tapping to get more practice from the scenario.</p>${active?`<div class="actions"><button class="btn primary" id="resumeCase">Resume ${active.title} →</button></div>`:''}${next?`<div class="actions"><button class="btn" id="nextCase">Start next case: ${next.title} →</button></div>`:`<div class="actions"><button class="btn" id="resetCases">Shuffle casebook again →</button></div>`}</section><section class="card"><div class="topic">Choose a case</div><div class="case-list">${CASES.map(c=>`<article class="case-tile"><div class="case-tile-top"><span class="mini-tag">${c.tag}</span><span class="case-score">${state.caseSeen.includes(c.id)?'✓ Cleared':'✧ New'}</span></div><h3>${c.icon} ${c.title}</h3><p>${c.setup}</p><button class="btn primary" data-case-id="${c.id}">${state.caseSeen.includes(c.id)?'Replay case →':'Play case →'}</button></article>`).join('')}</div></section>`;if($('#resumeCase'))$('#resumeCase').onclick=()=>{state.mode='case';save();render()};if($('#nextCase'))$('#nextCase').onclick=()=>startCase(next.id);if($('#resetCases'))$('#resetCases').onclick=()=>{state.caseSeen=[];save();render()};document.querySelectorAll('[data-case-id]').forEach(b=>b.onclick=()=>startCase(b.dataset.caseId))}
function casePlay(){const c=CASES.find(x=>x.id===state.caseId);if(!c){state.mode='home';window.tab='cases';render();return}const decisionDone=state.caseDecision!==null;const mathDone=state.caseMathChoice!==null;const facts=`<ul class="case-facts">${c.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`;let body='';if(state.casePhase==='decision'){body=`<div class="case-step">Step 1 · Choose your recommendation</div><h2 class="qtitle">${c.decisionQ}</h2>${c.choices.map((o,i)=>`<button class="choice case-choice ${decisionDone?(i===c.best?'correct':i===state.caseDecision?'wrong':''):''}" data-decision="${i}" ${decisionDone?'disabled':''}>${o}</button>`).join('')}${decisionDone?`<div class="feedback show"><strong>${state.caseDecision===c.best?'Strong call.':'Consider this decision lens.'}</strong><p><b>Recommended:</b> ${c.choices[c.best]}</p><p>${c.decisionWhy}</p></div><div class="actions"><button class="btn primary" id="toMath">Next: mental-math checkpoint →</button></div>`:''}`;}else{body=`<div class="case-step">Step 2 · Mental-math checkpoint</div><h2 class="qtitle">${c.mathQ}</h2>${c.mathChoices.map((o,i)=>`<button class="choice case-choice ${mathDone?(i===c.mathBest?'correct':i===state.caseMathChoice?'wrong':''):''}" data-math="${i}" ${mathDone?'disabled':''}>${o}</button>`).join('')}${mathDone?`<div class="feedback show"><strong>${state.caseMathChoice===c.mathBest?'Correct calculation.':'Here is the quick math.'}</strong><p>${c.mathWhy}</p><p><b>Case takeaway:</b> ${c.decisionWhy}</p></div><div class="actions"><button class="btn primary" id="finishCase">Complete case →</button></div>`:''}`;}
screen.innerHTML=`<section class="hero"><div class="season">🎄 Case Cabin · ${c.tag}</div><h1>${c.icon} ${c.title}</h1><p>Pause before you choose. What would you tell a product or finance leader?</p><div class="candy-rule"></div></section><section class="card"><div class="case-story"><p>${c.setup}</p>${facts}</div>${body}<div class="actions"><button class="btn" id="leaveCase">← Case Cabin</button></div></section>`;if(!decisionDone&&state.casePhase==='decision')document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>answerCaseDecision(b.dataset.decision));if(state.casePhase==='decision'&&decisionDone)$('#toMath').onclick=()=>{state.casePhase='math';save();render()};if(state.casePhase==='math')document.querySelectorAll('[data-math]').forEach(b=>b.onclick=()=>answerCaseMath(b.dataset.math));if(state.casePhase==='math-result')$('#finishCase').onclick=finishCase;$('#leaveCase').onclick=()=>{state.mode='home';window.tab='cases';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='cases'));save();render()}}
function progress(){const t=state.answered,a=t?Math.round(state.correct/t*100):0;screen.innerHTML=`<section class="hero"><div class="season">✦ Your winter progress</div><h1>Small rounds<br>add up.</h1><p>Progress and the question queue are saved on this device.</p></section><section class="card"><div class="statgrid"><div class="mini"><b>${t}</b><span>answered</span></div><div class="mini"><b>${a}%</b><span>accuracy</span></div><div class="mini"><b>${state.streak}</b><span>day streak</span></div></div><p class="how">Today: ${state.daily[today()]||0} answered · Bank: ${state.seen.length}/${rows.length} used</p><div class="bar"><i style="width:${state.seen.length/rows.length*100}%"></i></div></section><section class="card"><h2 class="panel-title">Practice mix</h2><p class="how">API revenue, pricing, commitments, forecasts, customer economics, capacity, sales efficiency, and product investment.</p><button class="btn primary" id="continue">Continue with 5 →</button></section>`;$('#continue').onclick=start}
function review(){const q=state.missed.length?byId.get(state.missed[0]):null;screen.innerHTML=`<section class="hero"><div class="season">↺ Your review pile</div><h1>Keep the tricky<br>ones close.</h1><p>Missed and bookmarked questions collect here.</p></section><section class="card">${q?`<p class="how">${state.missed.length} saved question${state.missed.length===1?'':'s'}</p><div class="reviewitem"><b>${q.title}</b><p class="how">${q.q}</p></div><button class="btn primary" id="review">Review next →</button><button class="text-btn" id="clear">Clear review pile</button>`:`<div class="empty">No questions saved yet.<br>Tap “Save for review” after an answer.</div>`}</section>`;if($('#review'))$('#review').onclick=()=>{state.current=state.missed.shift();state.mode='play';state.sessionDone=0;state.selected=null;play()};if($('#clear'))$('#clear').onclick=()=>{state.missed=[];save();render()}}
function render(){header();if(state.mode==='play'){play();return}if(state.mode==='case'){casePlay();return}if(state.mode==='setdone'){screen.innerHTML=`<section class="hero"><div class="season">✨ Round complete</div><h1>Nice work.<br>Keep it cozy.</h1><p>You finished ${state.session} questions. Your progress is saved on this phone.</p></section><section class="card"><div class="statgrid"><div class="mini"><b>${state.daily[today()]||0}</b><span>today</span></div><div class="mini"><b>${state.correct}</b><span>correct</span></div><div class="mini"><b>${state.streak}</b><span>day streak</span></div></div><div class="actions"><button class="btn" id="home">Lodge</button><button class="btn primary" id="again">Another ${state.session} →</button></div></section>`;$('#home').onclick=()=>{state.mode='home';render()};$('#again').onclick=()=>start(state.game);return}if(state.mode==='done'){screen.innerHTML=`<section class="hero"><div class="season">🏁 Snowbank cleared</div><h1>You reached the end<br>of the question set.</h1><p>You answered all ${rows.length} unique questions. Shuffle the full bank for another run.</p></section><section class="card"><button class="btn primary" id="reset">Shuffle a fresh set</button></section>`;$('#reset').onclick=()=>{state.queue=shuffle(rows.map(x=>x.id));state.seen=[];state.mode='home';save();render()};return}if(window.tab==='cases')caseHome();else if(window.tab==='games')games();else if(window.tab==='progress')progress();else if(window.tab==='review')review();else home()}
window.tab='play';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.tab=b.dataset.tab;state.mode='home';render()});render()})();
</script></body></html>
